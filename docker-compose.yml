name: Diplomatiki

services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: dipromatiki
      POSTGRES_PASSWORD: dipromatiki
      POSTGRES_DB: dipromatiki
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipromatiki"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dipromatiki
    ports:
      - "8080:8080"

volumes:
  postgres-data:
