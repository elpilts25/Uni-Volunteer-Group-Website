spring.application.name=dipromatiki

# Persist to Postgres unless another profile is chosen (the test profile still runs on H2)
spring.profiles.default=postgres

# H2 in-memory DB for local testing
spring.datasource.url=jdbc:h2:mem:dipromatiki;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (Base64-encoded 256-bit secret; replace in prod)
dipromatiki.security.jwt.secret=ZGlwcm9tYXRpa2lfc2VjcmV0X2tleV9mb3JfaG1hY19zaGEyNTZfYWxnb3JpdGhtXyEhMTIzNDU2
dipromatiki.security.jwt.expiration-ms=3600000

# Dev admin created at startup if missing; override the password outside local dev
dipromatiki.admin.username=admin
dipromatiki.admin.email=admin@dipromatiki.local
dipromatiki.admin.password=${DIPROMATIKI_ADMIN_PASSWORD:admin123}

# CORS
dipromatiki.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000
dipromatiki.security.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
dipromatiki.security.cors.allowed-headers=*
dipromatiki.security.cors.allow-credentials=true

